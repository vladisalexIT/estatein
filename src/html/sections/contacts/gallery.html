<section class="contacts-gallery" id="contacts-gallery" aria-labelledby="contacts-gallery-title">
  <!-- Чистый глобальный контейнер проекта для идеальных отступов по бокам -->
  <div class="contacts-gallery__container container">
    
    <!-- Макетная коробка с рамками, узорами и паддингами -->
    <div class="contacts-gallery__box">
      
      <!-- Сетка из первых 5 картинок -->
      <div class="contacts-gallery-grid">
        <ul class="contacts-gallery-grid__list" role="presentation">

          <!-- Картинка 1: Офис -->
          <li class="contacts-gallery-grid__item contacts-gallery-grid__item--office">
            <picture class="contacts-gallery-grid__picture">
              <!-- 🔥 ИСПРАВЛЕНО: Пути переведены на src/assets и расширение .webp -->
              <source media="(max-width: 769px)" srcset="/src/assets/images/contacts/gallery-office-mobile.webp">
              <source media="(max-width: 1440px)" srcset="/src/assets/images/contacts/gallery-office-laptop.webp">
              <img class="contacts-gallery-grid__img" src="/src/assets/images/contacts/gallery-office.webp" alt="Estatein open space office with modern workstations" width="718" height="342" loading="lazy">
            </picture>
          </li>
          
          <!-- Картинка 2: Команда в костюмах -->
          <li class="contacts-gallery-grid__item contacts-gallery-grid__item--team-1">
            <picture class="contacts-gallery-grid__picture">
              <source media="(max-width: 769px)" srcset="/src/assets/images/contacts/team-1-mobile.webp">
              <source media="(max-width: 1440px)" srcset="/src/assets/images/contacts/team-1-laptop.webp">
              <img class="contacts-gallery-grid__img" src="/src/assets/images/contacts/team-1.webp" alt="Four Estatein professionals smiling in business suits" width="554" height="212" loading="lazy">
            </picture>
          </li>

          <!-- Картинка 3: Совещание сверху -->
          <li class="contacts-gallery-grid__item contacts-gallery-grid__item--team-2">
            <picture class="contacts-gallery-grid__picture">
              <source media="(max-width: 769px)" srcset="/src/assets/images/contacts/team-2-mobile.webp">
              <source media="(max-width: 1440px)" srcset="/src/assets/images/contacts/team-2-laptop.webp">
              <img class="contacts-gallery-grid__img" src="/src/assets/images/contacts/team-2.webp" alt="Estatein team meeting at a large conference table top view" width="554" height="318" loading="lazy">
            </picture>
          </li>

          <!-- Картинка 4: Три сотрудника -->
          <li class="contacts-gallery-grid__item contacts-gallery-grid__item--team-3">
            <picture class="contacts-gallery-grid__picture">
              <source media="(max-width: 769px)" srcset="/src/assets/images/contacts/team-3-mobile.webp">
              <source media="(max-width: 1440px)" srcset="/src/assets/images/contacts/team-3-laptop.webp">
              <img class="contacts-gallery-grid__img" src="/src/assets/images/contacts/team-3.webp" alt="Three corporate team members smiling in the office" width="262" height="318" loading="lazy">
            </picture>
          </li>

          <!-- Картинка 5: Партнеры -->
          <li class="contacts-gallery-grid__item contacts-gallery-grid__item--team-4">
            <picture class="contacts-gallery-grid__picture">
              <source media="(max-width: 769px)" srcset="/src/assets/images/contacts/team-4-mobile.webp">
              <source media="(max-width: 1440px)" srcset="/src/assets/images/contacts/team-4-laptop.webp">
              <img class="contacts-gallery-grid__img" src="/src/assets/images/contacts/team-4.webp" alt="Estatein corporate partners posing for a photo" width="262" height="318" loading="lazy">
            </picture>
          </li>

        </ul>
      </div>

      <!-- Текстовый блок + Рукопожатие -->
      <div class="contacts-gallery-info">
        <div class="contacts-gallery-info__row">
          
          <!-- Парящие серые звёзды -->
          <div class="contacts-gallery-info__decoration" aria-hidden="true">
            <img src="/src/assets/icons/contacts/stars-gray.svg" alt="" width="68" height="30" loading="lazy">
          </div>

          <!-- Текст описания -->
          <div class="contacts-gallery-info__content">
            <h2 class="contacts-gallery-info__title" id="contacts-gallery-title">Explore Estatein's World</h2>
            <p class="contacts-gallery-info__text">
              Step inside the world of Estatein, where professionalism meets warmth, and expertise meets passion. Our gallery offers a glimpse into our team and workspaces, inviting you to get to know us better.
            </p>
          </div>

          <!-- Картинка 6: Рукопожатие -->
          <div class="contacts-gallery-info__handshake contacts-gallery-grid__handshake-wrapper">
            <picture class="contacts-gallery-grid__picture">
              <source media="(max-width: 769px)" srcset="/src/assets/images/contacts/gallery-handshake-mobile.webp">
              <source media="(max-width: 1440px)" srcset="/src/assets/images/contacts/gallery-handshake-laptop.webp">
              <img class="contacts-gallery-grid__img" src="/src/assets/images/contacts/gallery-handshake.webp" alt="Man and woman shaking hands in agreement during a business meeting" width="554" height="388" loading="lazy">
            </picture>
          </div>

        </div>
      </div>

    </div>
  </div>
</section>
