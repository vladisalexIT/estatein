<aside
  class="announcement"
  aria-label="Special announcement"
  data-js-announcement
>
  <div class="announcement__inner container">
    <div class="announcement__content">
      <span class="announcement__icon" aria-hidden="true">
        ✨
      </span>

      <p class="announcement__text">
        Discover Your Dream Property with Estatein
      </p>

      <a
        class="announcement__link"
        href="/properties.html"
      >
        Learn More
      </a>
    </div>

    <button
      class="announcement__close"
      type="button"
      aria-label="Close announcement"
      data-js-announcement-close
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M6 6L18 18M18 6L6 18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>
</aside>
